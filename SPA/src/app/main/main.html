<div class="flex-container">
    <div class="chat-list-container">
        <app-chat-list />
    </div>
    <div class="app-message-screen">
        <div class="chat-title">
            <h5>
                {{ chatTitle() }}
            </h5>
            <div class="btn-container">
                <button class="btn btn-success" (click)="openNewChatModal()">Nuevo Chat</button>
                <button class="btn btn-success" (click)="logOut()">
                    Cerrar Sesión
                </button>
            </div>
        </div>
        @if (currentChat()) {
            <app-message-screen />
        }
    </div>
    
    <app-chat-create-modal />
</div>
