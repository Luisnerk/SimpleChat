<p>chat-create-modal works!</p>
<button (click)="open(content)">Nuevo Chat</button>
<ng-template #content let-modal>
    <div class="modal-header">
        <h4 class="modal-title">Nuevo Chat</h4>
        <button class="btn-close" (click)="modal.close()"></button>
    </div>
    <div class="modal-body">
        <form [formGroup]="chatForm" (ngSubmit)="registerChat()">
            <div>
                <label for="name" class="form-label mt-4">Nombre</label>
                <input type="text" class="form-control" formControlName="name">
            </div>
            <div class="mb-4">
                <label for="name" class="form-label mt-4">Participantes</label>
                <ng-select [items]="users"
                            [multiple]="true"
                            bindLabel="name"
                            bindValue="id"
                            (search)="lookFor($event.term)"
                            (add)="addParticipant($event)"
                ></ng-select>
            </div>
            <input class="btn btn-success" type="submit">
        </form>
    </div>
</ng-template>
